<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zerkit Looper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <!-- The panel, laid out like the Circuit Tracks -->
    <section class="device" id="device">
      <div class="brand">
        <div class="brand-left">
          <div class="wordmark"><b>ZERKIT</b><span>LOOPER</span></div>
          <!-- New tab, so an unsaved project isn't lost -->
          <a class="gh" href="https://github.com/jpincas/zerkit-looper" target="_blank" rel="noopener" title="Source code on GitHub" aria-label="Source code on GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
        </div>
        <!-- Calculator-style readout: the tempo, or the swing while Shift is held (built by main.js) -->
        <div class="lcd" id="lcd" title="Tempo in BPM (Shift: swing %)"><div class="lcd-digits" id="lcd-digits"></div><span class="lcd-unit" id="lcd-unit">BPM</span></div>
        <div class="brand-right">
          <div id="project" class="project" title="The current project (• = unsaved changes)">Untitled</div>
          <div class="badge" id="circuit" title="Circuit: not connected">
            <svg viewBox="0 0 100 50"><path d="M50 25C40 10 12 8 12 25C12 42 40 40 50 25C60 10 88 8 88 25C88 42 60 40 50 25Z"/></svg>
          </div>
        </div>
      </div>
      <div class="knob-cell master-vol" id="master-vol"></div>
      <div class="knobs" id="knobs"></div>
      <div class="knob-cell master-int" id="master-int"></div>

      <!-- side buttons are placed into this grid by main.js -->
      <div class="row8 aux" id="aux"></div>
      <div class="row8 tracks" id="trackbar"></div>

      <!-- Pages: the pad area shows the Looper, or the Instruments or Kits page (Shift + Instrument / Kits) -->
      <div class="row8 pads mute-row page-looper" id="mute-row"></div>
      <div class="row8 pads solo-row page-looper" id="solo-row"></div>
      <div class="seq page-looper" id="seq">
          <div class="seq-head">
            <div class="seq-title" id="seq-title">Track 1</div>
            <select id="inst" class="inst" aria-label="Instrument for the selected track"></select>
            <span id="oct" class="seq-oct" title="Keyboard octave (, .)">C4</span>
            <span id="seq-len" class="seq-len"></span>
            <span id="status" class="status">Stopped</span>
            <span id="pos" class="pos" title="Bar.beat">1.1</span>
            <span class="beats" id="beats"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="roll-wrap"><canvas id="roll" class="roll"></canvas></div>
        </div>
      <div class="page page-presets" id="page-presets" hidden></div>
      <div class="page page-kits" id="page-kits" hidden></div>
      <div class="page page-kits page-grooves" id="page-grooves" hidden></div>
      <div class="page page-audio" id="page-audio" hidden></div>
      <div class="page page-midi" id="page-midi" hidden></div>
      <div class="page page-fx" id="page-fx" hidden></div>
      <div class="page page-synth" id="page-synth" hidden></div>
      <div class="page page-settings" id="page-settings" hidden></div>
    </section>

    <!-- Playing panel (Note): two-octave keyboard on synth tracks, 16-pad kit on drum tracks.
         Its columns line up with the panel's. -->
    <section class="keys-area">
      <div class="kb-side"><b id="kb-track">Track 1</b><span id="kb-inst"></span><span id="kb-oct"></span></div>
      <div class="kb-main">
        <div class="keyboard" id="keyboard"></div>
        <div class="kit" id="kit" hidden></div>
        <div class="kb-audio" id="kb-audio" hidden>Audio tracks record their input: nothing to play here.</div>
      </div>
    </section>
  </main>
  <!-- Project screens (name box, Open list) and the notice that fades out after saving -->
  <div id="dialog" class="dialog" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- Browsers keep sound off until a click or key press on the page -->
  <div id="sound-gate" class="sound-gate" hidden>Click anywhere to turn the sound on</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
