<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDI Monitor</title>
  <style>
    :root { --bg: #0b0d11; --panel: #14171d; --line: #262b35; --text: #e6e8ec; --muted: #7d8594; --ok: #6fd28a; --bad: #ff5f5f; --accent: #f2b33d; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
    h1 { font-size: 18px; margin: 0; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .status { font-weight: 600; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    ul { margin: 6px 0 0; padding-left: 18px; }
    .muted { color: var(--muted); }
    #log { font: 12px/1.5 ui-monospace, Menlo, monospace; height: 55vh; overflow: auto; white-space: pre; }
    #log .clock { color: var(--muted); }
    #log .new { color: var(--accent); }
    button { background: #1c2029; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>MIDI Monitor</h1>
  <div class="panel">
    <div id="status" class="status">Starting…</div>
    <div id="hint" class="muted"></div>
  </div>
  <div class="panel">
    <strong>Devices</strong>
    <div id="devices" class="muted">None yet</div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Messages</strong>
      <span><span id="clock" class="muted"></span> <button id="clear">Clear</button></span>
    </div>
    <div id="log"></div>
  </div>
</main>
<script>
// Every MIDI message is shown here and posted to the dev server (/log), so it can be read on the spark.
const $ = id => document.getElementById(id);
const queue = [];
const post = obj => queue.push(JSON.stringify({ t: new Date().toISOString(), ...obj }));
setInterval(() => {
  if (!queue.length) return;
  const body = queue.splice(0).join('\n');
  fetch('/log', { method: 'POST', body }).catch(() => {});
}, 200);

// Patched firmware LOOP01: button id N sends CC (20 + N) on channel 15.
const BUTTONS = ['Synth 1', 'Synth 2', 'MIDI 1', 'MIDI 2', 'Drum 1', 'Drum 2', 'Drum 3', 'Drum 4', 'Preset', 'Note',
  'Velocity', 'Gate', 'Pattern Settings', 'Patterns', 'Mixer', 'FX', 'Record', 'Play', 'Scales', 'Octave down',
  'Octave up', '1-16/17-32', 'Tempo/Swing', 'Clear', 'Duplicate', 'Save', 'Projects', 'Shift'];
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName = n => NOTE[n % 12] + (Math.floor(n / 12) - 1);

function decode(d) {
  const [s, a, b] = d;
  const ch = (s & 0x0f) + 1;
  if (ch === 15) {   // patched firmware LOOP02: our control-surface messages
    if ((s & 0xf0) === 0x90) return `PAD ${a} pressed, velocity ${b}`;
    if ((s & 0xf0) === 0x80) return `PAD ${a} released`;
    if ((s & 0xf0) === 0xb0 && a === 100) return `   gate ${b.toString(2).padStart(7, '0')}  (MIDI ${b & 4 ? 'OFF' : 'on'}, lock ${b & 1})`;
    if ((s & 0xf0) === 0xb0 && a >= 1 && a <= 10) {
      const name = a <= 8 ? `MACRO KNOB ${a}` : `MASTER KNOB ${a - 9}`;
      return `${name}: ${b}  (as a signed turn: ${b >= 64 ? b - 128 : '+' + b})`;
    }
  }
  switch (s & 0xf0) {
    case 0x80: return `ch${ch} note-off ${a} (${noteName(a)}) vel ${b}`;
    case 0x90: return b ? `ch${ch} note-on  ${a} (${noteName(a)}) vel ${b}` : `ch${ch} note-off ${a} (${noteName(a)})`;
    case 0xa0: return `ch${ch} poly-aftertouch ${a} = ${b}`;
    case 0xb0:
      if (ch === 15 && a >= 20 && a < 20 + BUTTONS.length) return `BUTTON ${BUTTONS[a - 20]} ${b ? 'pressed' : 'released'}  (ch15 CC ${a} = ${b})`;
      return `ch${ch} CC ${a} = ${b}`;
    case 0xc0: return `ch${ch} program ${a}`;
    case 0xd0: return `ch${ch} channel-pressure ${a}`;
    case 0xe0: return `ch${ch} pitch-bend ${((b << 7) | a) - 8192}`;
  }
  return { 0xf0: 'sysex', 0xf2: 'song-position', 0xf8: 'clock', 0xfa: 'START', 0xfb: 'CONTINUE', 0xfc: 'STOP', 0xfe: 'active-sensing', 0xff: 'reset' }[s] ?? `system 0x${s.toString(16)}`;
}

const hex = d => [...d].map(x => x.toString(16).padStart(2, '0')).join(' ');
let clocks = 0;
function line(text, cls) {
  const log = $('log');
  const el = document.createElement('div');
  el.textContent = text;
  if (cls) el.className = cls;
  log.prepend(el);
  while (log.childElementCount > 500) log.lastChild.remove();
}
$('clear').onclick = () => { $('log').textContent = ''; };

function showDevices(access) {
  const list = (ports, kind) => [...ports.values()].map(p => ({ kind, id: p.id, name: p.name, manufacturer: p.manufacturer, state: p.state }));
  const devices = [...list(access.inputs, 'input'), ...list(access.outputs, 'output')];
  $('devices').innerHTML = devices.length
    ? '<ul>' + devices.map(d => `<li>${d.kind}: <b>${d.name}</b> <span class="muted">(${d.manufacturer || 'unknown maker'}, ${d.state})</span></li>`).join('') + '</ul>'
    : 'No MIDI devices found. Is it plugged in and switched on?';
  post({ kind: 'devices', devices });
  for (const input of access.inputs.values()) {
    input.onmidimessage = e => {
      const d = e.data;
      if (d[0] === 0xf8) { clocks++; return; } // clock floods at 24 per beat: count it instead
      if (d[0] === 0xfe) return;
      const text = decode(d);
      line(`${input.name.padEnd(22)} ${hex(d).padEnd(9)} ${text}`, d[0] >= 0xf0 ? 'clock' : '');
      post({ kind: 'midi', port: input.name, bytes: [...d], text });
    };
  }
}
setInterval(() => { $('clock').textContent = clocks ? `clock ticks: ${clocks}` : ''; }, 250);

async function start() {
  if (!window.isSecureContext || !navigator.requestMIDIAccess) {
    $('status').textContent = 'Web MIDI is blocked on this page';
    $('status').className = 'status bad';
    $('hint').innerHTML = `Chrome only allows MIDI on https or localhost. Add <b>${location.origin}</b> in chrome://flags/#unsafely-treat-insecure-origin-as-secure, then relaunch Chrome.`;
    post({ kind: 'error', error: 'insecure-context', origin: location.origin, ua: navigator.userAgent });
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    $('status').textContent = 'MIDI access granted';
    $('status').className = 'status ok';
    showDevices(access);
    access.onstatechange = e => {
      line(`-- ${e.port.type} "${e.port.name}" ${e.port.state}`, 'new');
      showDevices(access);
    };
  } catch (err) {
    $('status').textContent = 'MIDI access refused: ' + err.message;
    $('status').className = 'status bad';
    post({ kind: 'error', error: String(err) });
  }
}
post({ kind: 'page-open', ua: navigator.userAgent });
start();
</script>
</body>
</html>
