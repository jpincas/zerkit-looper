<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circuit Lights</title>
  <style>
    :root { --bg: #0b0d11; --panel: #14171d; --line: #262b35; --text: #e6e8ec; --muted: #7d8594; --ok: #6fd28a; --bad: #ff5f5f; --accent: #f2b33d; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
    h1 { font-size: 18px; margin: 0; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { background: #1c2029; color: var(--text); border: 1px solid #3a4150; border-radius: 7px; padding: 6px 12px; font: inherit; cursor: pointer; }
    button.on { border-color: var(--accent); color: var(--accent); }
    .muted { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); }
    .pads { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-width: 520px; }
    .pad, .led { border: 1px solid #333a46; border-radius: 6px; background: #111; color: #cfd3da; cursor: pointer;
                 font: 11px ui-monospace, Menlo, monospace; display: flex; align-items: flex-end; justify-content: center; }
    .pad { aspect-ratio: 1; padding-bottom: 3px; }
    .led { padding: 5px 8px; min-width: 70px; }
    .pad.pressed, .led.pressed { outline: 2px solid #fff; }
    #palette { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; max-width: 520px; }
    #palette div { aspect-ratio: 1; border-radius: 3px; border: 1px solid #333a46; font: 9px ui-monospace, monospace; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #palette div.sel { outline: 2px solid #fff; }
    #log { font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 140px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>Circuit lights</h1>
  <div class="panel row">
    <span id="status" class="muted">Connecting…</span>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <b>Mode</b>
      <button id="m-echo" class="on">Echo: press things on the Circuit</button>
      <button id="m-paint">Paint: click lights here</button>
      <button id="m-pal">Palette: show codes on the pads</button>
      <button id="all-off">All off</button>
    </div>
    <p id="hint" class="muted" style="margin:0 0 10px">Press pads and buttons on the Circuit: they light up in the chosen colour while held.</p>
    <div class="row" id="pal-pages" hidden style="margin-bottom:10px"></div>
    <div class="pads" id="pads"></div>
    <div class="row" style="margin-top:10px" id="leds"></div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:8px"><b>Colour</b><span id="cur" class="muted"></span></div>
    <div id="palette"></div>
    <p class="muted" style="margin:8px 0 0">Swatches are guesses for codes we know; the Circuit shows the truth (use Palette mode).</p>
  </div>

  <div class="panel"><div id="log"></div></div>
</main>
<script>
// Novation palette codes we know (CIRCUIT-HACKS-RC notes); the rest show as grey numbers.
const KNOWN = { 0x00:'#000', 0x01:'#fff', 0x02:'#888', 0x05:'#797979', 0x07:'#2929cc', 0x09:'#1a47ff', 0x0A:'#163ddb', 0x12:'#5e84cc',
  0x13:'#44ddff', 0x14:'#2a8aa0', 0x17:'#2ecc40', 0x20:'#3db24f', 0x2A:'#f3e2b3', 0x2B:'#ffb000', 0x2D:'#ffff19', 0x2E:'#292904',
  0x32:'#c63ac6', 0x38:'#6a1f6a', 0x3B:'#ff4c7b', 0x45:'#ff4e13', 0x46:'#3355ff', 0x49:'#9a7bff', 0x4D:'#20b2aa', 0x4E:'#0f5552',
  0x51:'#ffb000', 0x52:'#cc8c00', 0x53:'#ff0000', 0x54:'#660000', 0x5F:'#ff7fbf', 0x60:'#ff9fcf', 0x69:'#292910', 0x6A:'#ff9a7a', 0x6B:'#e0a080' };
const BUTTONS = ['Synth 1', 'Synth 2', 'MIDI 1', 'MIDI 2', 'Drum 1', 'Drum 2', 'Drum 3', 'Drum 4', 'Preset', 'Note',
  'Velocity', 'Gate', 'Pat Settings', 'Patterns', 'Mixer', 'FX', 'Record', 'Play', 'Scales', 'Oct down',
  'Oct up', '1-16/17-32', 'Tempo', 'Clear', 'Duplicate', 'Save', 'Projects', 'Shift'];
const $ = id => document.getElementById(id);
const queue = [];
setInterval(() => { if (queue.length) fetch('/log', { method: 'POST', body: queue.splice(0).join('\n') }).catch(() => {}); }, 300);
function log(msg) {
  const el = document.createElement('div'); el.textContent = `${new Date().toLocaleTimeString()}  ${msg}`; $('log').prepend(el);
  queue.push(JSON.stringify({ t: new Date().toISOString(), kind: 'lights', msg }));
}

let out = null, inp = null, mode = 'echo', colour = 0x53, palPage = 0;
const state = new Array(69).fill(0);

function send(bytes) { if (out) out.send(bytes); }
function setLed(i, c) { state[i] = c; send([0xF0, 0x7D, 0x01, i, c & 0x7F, 0xF7]); paint(); }
function setAll(colours) { colours.forEach((c, i) => state[i] = c); send([0xF0, 0x7D, 0x02, 0, ...colours.map(c => c & 0x7F), 0xF7]); paint(); }

// ---- on-screen panel: 32 pads + the other LEDs (buttons 32 + id, knobs 60-67, filter 68)
const padEls = [], ledEls = {};
for (let i = 0; i < 32; i++) {
  const el = document.createElement('div'); el.className = 'pad'; el.textContent = i;
  el.onclick = () => click(i); $('pads').appendChild(el); padEls.push(el);
}
const others = [...BUTTONS.map((n, id) => [32 + id, n]), ...[0,1,2,3,4,5,6,7].map(k => [60 + k, `Knob ${k + 1}`]), [68, 'Filter']];
for (const [i, name] of others) {
  const el = document.createElement('div'); el.className = 'led'; el.textContent = name;
  el.onclick = () => click(i); $('leds').appendChild(el); ledEls[i] = el;
}
const swatch = c => KNOWN[c] || '#222';
function paint() {
  padEls.forEach((el, i) => { el.style.background = swatch(state[i]); el.textContent = mode === 'pal' ? state[i].toString(16) : i; });
  for (const i in ledEls) ledEls[i].style.background = state[i] ? swatch(state[i]) : '#111';
}
function click(i) {
  if (mode === 'pal' && i < 32) { colour = state[i]; showPalette(); return; }
  setLed(i, state[i] === colour ? 0 : colour);
}

// ---- palette picker
for (let c = 0; c < 128; c++) {
  const el = document.createElement('div'); el.style.background = swatch(c); el.textContent = KNOWN[c] ? '' : c.toString(16);
  el.title = `code ${c} (0x${c.toString(16)})`; el.onclick = () => { colour = c; showPalette(); };
  $('palette').appendChild(el);
}
function showPalette() {
  [...$('palette').children].forEach((el, c) => el.classList.toggle('sel', c === colour));
  $('cur').textContent = `code ${colour} (0x${colour.toString(16)})`;
}
showPalette();

// ---- modes
function setMode(m) {
  mode = m;
  for (const [id, mm] of [['m-echo', 'echo'], ['m-paint', 'paint'], ['m-pal', 'pal']]) $(id).classList.toggle('on', mm === m);
  $('pal-pages').hidden = m !== 'pal';
  $('hint').textContent = { echo: 'Press pads and buttons on the Circuit: they light up in the chosen colour while held.',
    paint: 'Click a pad or light here to toggle it in the chosen colour.',
    pal: 'Each page shows 32 palette codes on the pads (the hex code is on each pad here). Click one to pick it.' }[m];
  if (m === 'pal') showPage(palPage); else paint();
}
function showPage(p) {
  palPage = p;
  [...$('pal-pages').children].forEach((b, k) => b.classList.toggle('on', k === p));
  setAll(state.map((c, i) => i < 32 ? p * 32 + i : c));
}
for (let p = 0; p < 4; p++) {
  const b = document.createElement('button'); b.textContent = `Codes ${p * 32}-${p * 32 + 31}`; b.onclick = () => showPage(p); $('pal-pages').appendChild(b);
}
$('m-echo').onclick = () => setMode('echo');
$('m-paint').onclick = () => setMode('paint');
$('m-pal').onclick = () => setMode('pal');
$('all-off').onclick = () => setAll(new Array(69).fill(0));

// ---- input from the Circuit (LOOP firmware, channel 15)
function onMidi(ev) {
  const [s, a, b] = ev.data;
  if (s === 0xBE && a === 100) return;                               // gate health report
  let led = null, down = false, label = '';
  if (s === 0x9E) { led = a; down = true; label = `pad ${a} vel ${b}`; }
  else if (s === 0x8E) { led = a; label = `pad ${a} up`; }
  else if (s === 0xBE && a >= 20 && a < 48) { led = 32 + a - 20; down = b > 0; label = `${BUTTONS[a - 20]} ${down ? 'down' : 'up'}`; }
  else return;
  (led < 32 ? padEls[led] : ledEls[led])?.classList.toggle('pressed', down);
  if (mode === 'echo') setLed(led, down ? colour : 0);
  if (down) log(label);
}

navigator.requestMIDIAccess({ sysex: true }).then(midi => {
  const pick = () => {
    out = [...midi.outputs.values()].find(p => /circuit tracks midi/i.test(p.name)) || null;
    const i2 = [...midi.inputs.values()].find(p => /circuit tracks midi/i.test(p.name)) || null;
    if (inp && inp !== i2) inp.onmidimessage = null;
    inp = i2; if (inp) inp.onmidimessage = onMidi;
    $('status').textContent = out ? `Connected to "${out.name}"` : 'No Circuit Tracks found';
    $('status').className = out ? 'ok' : 'bad';
    if (out) setAll(state);
  };
  midi.onstatechange = pick; pick();
}).catch(e => { $('status').textContent = 'MIDI access refused: ' + e.message; $('status').className = 'bad'; });
paint();
</script>
</body>
</html>
