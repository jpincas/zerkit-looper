<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send to Spark</title>
  <style>
    :root { --bg: #0b0d11; --panel: #14171d; --line: #262b35; --text: #e6e8ec; --muted: #7d8594; --ok: #6fd28a; --accent: #f2b33d; color-scheme: dark; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
    h1 { font-size: 20px; margin: 0; }
    #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 48px 16px; text-align: center; color: var(--muted); cursor: pointer; }
    #drop.over { border-color: var(--accent); color: var(--text); }
    #files div { padding: 4px 0; }
    .ok { color: var(--ok); }
  </style>
</head>
<body>
<main>
  <h1>Send a file to the spark</h1>
  <p class="muted">Drop the official Circuit Tracks firmware (.syx) here. It's saved on the spark in <code>circuit/incoming/</code>.</p>
  <label id="drop">Drop files here, or click to choose<input id="pick" type="file" multiple hidden></label>
  <div id="files"></div>
</main>
<script>
const drop = document.getElementById('drop');
async function send(files) {
  for (const f of files) {
    const row = document.createElement('div');
    row.textContent = `Sending ${f.name} (${(f.size / 1024).toFixed(0)} KB)…`;
    document.getElementById('files').prepend(row);
    const res = await fetch('/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
    row.textContent = res.ok ? `✓ ${f.name} saved on the spark` : `✗ ${f.name} failed (${res.status})`;
    if (res.ok) row.className = 'ok';
  }
}
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); send(e.dataTransfer.files); });
document.getElementById('pick').addEventListener('change', e => send(e.target.files));
</script>
</body>
</html>
